name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test the tree and ore logic
        run: cargo test --locked
      - name: Package the .hnmod
        run: python3 tools/package.py
      - uses: actions/upload-artifact@v4
        with:
          name: timber-hnmod
          path: target/*.hnmod
      # Push a tag like v0.2.0 to publish a release with the .hnmod attached.
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: target/*.hnmod
          generate_release_notes: true
